<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Large Rounded Square with Gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90E2"/>
      <stop offset="100%" stop-color="#0077CC"/>
    </linearGradient>
  </defs>

  <!-- Full-size rounded square (32px margin) -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bg)"/>

  <!-- LEFT BUBBLE: Moved UP (top-aligned, closer to top edge) -->
  <g transform="translate(64, 40) scale(0.78)">
    <path d="M140 160 H70 c-22 0 -40 18 -40 40 v100 c0 22 18 40 40 40 h35 v35 l35 -35 h60 c22 0 40 -18 40 -40 v-100 c0 -22 -18 -40 -40 -40 h-60 z" fill="#FFFFFF"/>
    <circle cx="90" cy="240" r="14" fill="#4A90E2"/>
    <circle cx="130" cy="240" r="14" fill="#4A90E2"/>
    <circle cx="170" cy="240" r="14" fill="#4A90E2"/>
  </g>

  <!-- RIGHT BUBBLE: Centered vertically (as before) -->
  <g transform="translate(448, 80) scale(-0.78, 0.78)">
    <path d="M140 160 H70 c-22 0 -40 18 -40 40 v100 c0 22 18 40 40 40 h35 v35 l35 -35 h60 c22 0 40 -18 40 -40 v-100 c0 -22 -18 -40 -40 -40 h-60 z" fill="#FFFFFF"/>
    <circle cx="90" cy="240" r="14" fill="#4A90E2"/>
    <circle cx="130" cy="240" r="14" fill="#4A90E2"/>
    <circle cx="170" cy="240" r="14" fill="#4A90E2"/>
  </g>
</svg>